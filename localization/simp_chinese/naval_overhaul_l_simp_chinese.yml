 je_naval_arms_race: "大洋争霸：海军军备竞赛"
 je_naval_arms_race_reason: "随着铁甲与巨炮时代的来临，各大强国围绕远洋航线与殖民地展开了激烈的舰队竞赛。扩充现代化舰队与造船工业，以确立无可争议的制海权。"
 je_naval_arms_race_treaty_freeze_header: "海军限武条约冻结军备竞赛"
 je_naval_arms_race_treaty_freeze_effect_header: "造舰竞赛动员中止"
 je_naval_arms_race_treaty_freeze_desc: "国际海军限武条约已对我国主力舰队施加具有约束力的吨位上限，无限制的大洋造舰竞赛暂时冻结；若未来条约瓦解或启动自动升级条款，军备竞赛将再度点燃。"

 naval_overhaul.1.t: "大洋舰队辩论"
 naval_overhaul.1.d: "海军部与财政部就我国未来十年的造舰路线展开了激烈辩论。究竟应当集中资源打造决战主力舰队，还是大力扶持造船厂与护航驱逐体系？"
 naval_overhaul.1.f: "“谁控制了海洋，谁就控制了世界贸易；谁控制了世界贸易，谁就拥有了全世界的财富。”"
 naval_overhaul.1.a: "贯彻决战舰队主义！"
 naval_overhaul.1.b: "扩建船坞，以造舰订单拉动工业。"
 naval_overhaul.1.c: "强化海员训练与舰队战术素养。"

 naval_overhaul.2.t: "现代海战联合演习"
 naval_overhaul.2.d: "我国海军近期组织了涵盖潜艇破交、驱逐反潜与主力舰炮击的跨海区联合演习，验证了全新十槽改装体系的协同作战能力。"
 naval_overhaul.2.f: "没有单一的无敌巨舰，只有各司其职的钢铁编队。"
 naval_overhaul.2.a: "总结演习经验，提升全军战备。"
 naval_overhaul.2.b: "将改装需求反馈给各大造船厂。"

 utility_mod_underway_replenishment: "海上横向补给装置"
 utility_mod_underway_replenishment_desc: "专用的海上补给吊杆与输油软管使军舰得以在远洋航行中接受补给，显著延长[concept_fleet]持续作战时间。"

 naval_condition_night_action: "夜间海战"
 naval_condition_night_action_desc: "夜幕笼罩战区，光学测距与护航协同均受到严重干扰。"
 naval_condition_squall_line: "突袭飑线"
 naval_condition_squall_line_desc: "狂风与骤雨打乱了舰队阵型并削弱了火控精度。"
 naval_condition_subsurface_ambush: "潜艇伏击海域"
 naval_condition_subsurface_ambush_desc: "潜望镜与鱼雷航迹迫使护航舰艇不断采取规避机动。"
 naval_condition_heavy_swell: "巨浪涌动"
 naval_condition_heavy_swell_desc: "涌动的巨浪使舰炮平台剧烈摇晃并拖慢[concept_fleet]航速。"
 naval_condition_clear_horizon: "晴朗海空"
 naval_condition_clear_horizon_desc: "极佳的能见度有利于舰载航空侦察与远距离精准炮击。"

 naval_arms_race_progress_bar: "海军扩军势头"
 naval_arms_race_progress_bar_desc: "追踪主力舰扩建迈向海上霸权的推进节奏。"
 naval_arms_race_progress_surge_desc: "舰队高速扩张"
 naval_arms_race_progress_steady_desc: "船坞稳步建造"
 naval_arms_race_progress_stall_desc: "舰队规模萎缩"
 naval_arms_race_emergency_budget_btn: "追加紧急海军预算"
 naval_arms_race_emergency_budget_btn_desc: "批准紧急追加军费以加速船坞建造，但会推高军需品开支。"
 naval_arms_race_diplomatic_inquiry_btn: "外交质询与降温"
 naval_arms_race_diplomatic_inquiry_btn_desc: "向竞争对手释放克制信号以缓解国际猜疑与恶名。"
 je_naval_arms_race_status_treaty_escalator: "已触发升级条款：海军扩军重启。"
 je_naval_arms_race_status_active: "船坞正全力扩建以达到 80 支舰队规模。"
 je_naval_arms_race_shrink_header: "海军裁减缩编"
 je_naval_arms_race_shrink_effect_header: "军备竞赛中止"
 je_naval_arms_race_shrink_desc: "我国[concept_fleet]规模已跌破维持海军军备竞赛的最低门槛。"

 modifier_naval_arms_race_emergency_budget: "紧急海军预算"
 modifier_naval_arms_race_diplomatic_restraint: "海军外交克制"
 modifier_naval_ironclad_transition_strain: "风帆向铁甲转型阵痛"
 modifier_naval_ironclad_modernization_drive: "铁甲船坞现代化"
 modifier_naval_radar_breakthrough: "火控雷达突破"
 modifier_naval_convoy_doctrine_reform: "护航船团条令"
 modifier_naval_submarine_crisis_mobilization: "反潜紧急动员"
 modifier_naval_aviation_pioneers: "海军航空兵先驱"
 modifier_naval_flagship_triumph: "旗舰凯旋"

 naval_overhaul.3.t: "风帆向铁甲转型之争"
 naval_overhaul.3.d: "尽管蒸汽铁甲舰已让传统木壳战列舰彻底过时，海军部中的保守派仍死守风帆战列线荣光不放。"
 naval_overhaul.3.f: "橡木与帆布曾铸就帝国，如今唯有钢铁与蒸汽能守卫海疆。"
 naval_overhaul.3.a: "全力推进铁甲船坞现代化改造。"
 naval_overhaul.3.b: "安抚军官团情绪，稳步推进改革。"

 naval_overhaul.4.t: "破交危机与护航改革"
 naval_overhaul.4.d: "水下破交潜艇正威胁远洋商路安全，海军参谋部必须在组织护航船团与全面反潜动员之间做出抉择。"
 naval_overhaul.4.f: "潜伏在浪涛之下的杀机，考验着每一艘护航舰的神经。"
 naval_overhaul.4.a: "推行严格的护航船团护卫条令。"
 naval_overhaul.4.b: "启动反潜舰艇紧急造船动员。"

 naval_overhaul.5.t: "火控与雷达技术突破"
 naval_overhaul.5.d: "海军工程师成功研制出可在黑夜与暴风雨中锁定敌舰轮廓的无线电测距与火控雷达系统。"
 naval_overhaul.5.f: "当风浪与黑夜遮蔽光学测距仪时，电波仍能穿透迷雾锁定目标。"
 naval_overhaul.5.a: "在主力舰队全面列装火控雷达。"
 naval_overhaul.5.b: "借技术突破之势重燃造舰竞赛。"

 naval_overhaul.6.t: "海军航空兵海试"
 naval_overhaul.6.d: "侦察水上飞机与舰载机顺利完成首次舰队联合演习，大幅拓展了海战侦查半径。"
 naval_overhaul.6.f: "海战的视野不再受限于桅杆的高度。"
 naval_overhaul.6.a: "正式组建常设海军航空兵部队。"
 naval_overhaul.6.b: "向全军通报海试捷报以振奋士气。"

 naval_overhaul.7.t: "旗舰大捷凯旋"
 naval_overhaul.7.d: "我国[concept_fleet]旗舰在决定性海战中凯旋而归，令全国船坞工人与水兵士气大振。"
 naval_overhaul.7.f: "旗舰的胜利之声从大洋彼岸一直回荡到首都。"
 naval_overhaul.7.a: "宣告全国海军大捷庆典。"
 naval_overhaul.7.b: "借此胜势彰显克制而威严的海权声望。"
