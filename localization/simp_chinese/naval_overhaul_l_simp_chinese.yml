l_simp_chinese:
 ship_mod_slot_hull: "船体结构"
 ship_mod_slot_secondary: "副炮与防空"
 ship_mod_slot_utility_4: "配件槽位4"

 ship_mod_hull_standard: "标准均衡船体"
 ship_mod_hull_standard_desc: "结构可靠、易于维护的标准造船工艺，兼顾耐久度与后勤经济性。"
 ship_mod_hull_lightweight: "轻量化高速船体"
 ship_mod_hull_lightweight_desc: "削减冗余装甲隔舱以换取更高航速、更低可视性与更少补给消耗。"
 ship_mod_hull_reinforced: "加强水密抗沉船体"
 ship_mod_hull_reinforced_desc: "多层水密隔舱与防雷凸出部大幅提升抗沉性与抗致命一击能力，但会降低航速并增加可视性与补给负担。"
 ship_mod_hull_subdivided: "细密水密隔舱船体"
 ship_mod_hull_subdivided_desc: "纵横交错的细密水密隔舱结构，显著降低船体损伤与被致命一击进水风险。"
 ship_mod_secondary_dual_purpose: "高平两用副炮组"
 ship_mod_secondary_dual_purpose_desc: "大仰角高射速高平两用副炮，兼顾水面防雷击与防空屏卫力。"
 ship_mod_secondary_heavy_aa: "重型高射炮组"
 ship_mod_secondary_heavy_aa_desc: "大口径高射炮阵，专门拦截敌方舰载机与提升舰队防空屏卫力。"
 ship_mod_secondary_asw_depth_charges: "反潜深弹副炮组"
 ship_mod_secondary_asw_depth_charges_desc: "配备深水炸弹投射器与速射副炮，大幅提升对潜艇的侦察力、命中与杀伤。"
 utility_mod_sonar_suite: "主动声呐与深水炸弹"
 utility_mod_sonar_suite_desc: "专业反潜探测与深弹投射装置，大幅增强侦察力及对潜艇的命中与摧毁效率。"
 utility_mod_snorkel: "潜艇通气管"
 utility_mod_snorkel_desc: "允许潜艇在水下潜望镜深度使用柴油机充电并航行，大幅降低可视性并延长远洋航程。"
 utility_mod_minesweeping_gear: "扫雷具与护航绞车"
 utility_mod_minesweeping_gear_desc: "近海扫雷与护航作业设备，大幅提升舰队屏卫力与侦察力。"

 ship_mod_secondary_standard: "标准副炮组"
 ship_mod_secondary_standard_desc: "常规小口径副炮配置，提供基础近距火力与护航屏卫力。"
 ship_mod_secondary_torpedo_defense: "反雷击驱逐副炮"
 ship_mod_secondary_torpedo_defense_desc: "密集速射副炮阵，专为拦截鱼雷艇、驱逐舰与潜艇的近距突袭而设计。"
 ship_mod_secondary_heavy_casemate: "重型炮廓副炮"
 ship_mod_secondary_heavy_casemate_desc: "大口径炮廓副炮提供可观的额外船体与船员杀伤，但会显著增加易损性与可视性。"

 utility_mod_fire_control_radar: "火控雷达与光学测距仪"
 utility_mod_fire_control_radar_desc: "精密光学与无线电火控系统，显著提升命中率与致命一击概率，但电磁与桅杆特征会增大可视性。"
 utility_mod_damage_control: "中央损管与防雷隔舱"
 utility_mod_damage_control_desc: "体系化消防注水与损管小组，大幅降低承受的船体伤害、船员伤亡与被致命一击概率。"
 utility_mod_aa_director: "防空火控指挥仪"
 utility_mod_aa_director_desc: "集中式高炮指挥仪，为舰队提供极强的防空屏卫力与对航母编队的精准拦截。"
 utility_mod_torpedo_tubes: "甲板鱼雷发射管"
 utility_mod_torpedo_tubes_desc: "可对敌方主力舰造成致命一击穿甲的重型鱼雷，但甲板鱼雷管会增大自身易损性与殉爆风险。"
 utility_mod_extra_bunkers: "远洋副油箱与补给舱"
 utility_mod_extra_bunkers_desc: "扩展燃油与淡水储备，显著延长无补给远洋作战半径并降低日常补给消耗。"
 utility_mod_dazzle_camo: "炫目迷彩与消磁涂装"
 utility_mod_dazzle_camo_desc: "光学干扰迷彩涂装，显著降低敌方测距精度与被致命一击概率。"
 utility_mod_hydrophone_array: "被动水听器阵列"
 utility_mod_hydrophone_array_desc: "静默被动声学监听阵列，在保持极低可视性的同时提供高水准海区侦察力与破交效率。"
 utility_mod_autoloader: "机械式快速装弹机"
 utility_mod_autoloader_desc: "自动化扬弹与装填机构，大幅加快主炮射击准备速度，但对弹药补给与舱室防护提出更高要求。"
 utility_mod_reinforced_magazine: "防爆弹药库"
 utility_mod_reinforced_magazine_desc: "加厚防闪燃装甲隔门，显著降低易损性与被致命一击概率。"
 utility_mod_scouting_seaplane: "弹射侦察水上飞机"
 utility_mod_scouting_seaplane_desc: "舰载弹射侦察机极大扩展海区侦察力与校射精度，但甲板机库会增加可视性与补给消耗。"

 modifier_naval_construction_boom: "海军造船繁荣"
 modifier_naval_hegemony_tier_1: "地区海军强国"
 modifier_naval_hegemony_tier_2: "大洋海权帝国"
 modifier_naval_hegemony_tier_3: "全球制海霸主"
 modifier_naval_victory_morale: "海战大捷士气"
 modifier_naval_arms_race_focus: "海军军备竞赛动员"

 je_naval_arms_race: "大洋争霸：海军军备竞赛"
 je_naval_arms_race_reason: "随着铁甲与巨炮时代的来临，各大强国围绕远洋航线与殖民地展开了激烈的舰队竞赛。扩充现代化舰队与造船工业，以确立无可争议的制海权。"

 naval_overhaul.1.t: "大洋舰队辩论"
 naval_overhaul.1.d: "海军部与财政部就我国未来十年的造舰路线展开了激烈辩论。究竟应当集中资源打造决战主力舰队，还是大力扶持造船厂与护航驱逐体系？"
 naval_overhaul.1.f: "“谁控制了海洋，谁就控制了世界贸易；谁控制了世界贸易，谁就拥有了全世界的财富。”"
 naval_overhaul.1.a: "贯彻决战舰队主义！"
 naval_overhaul.1.b: "扩建船坞，以造舰订单拉动工业。"
 naval_overhaul.1.c: "强化海员训练与舰队战术素养。"

 naval_overhaul.2.t: "现代海战联合演习"
 naval_overhaul.2.d: "我国海军近期组织了涵盖潜艇破交、驱逐反潜与主力舰炮击的跨海区联合演习，验证了全新十槽改装体系的协同作战能力。"
 naval_overhaul.2.f: "没有单一的无敌巨舰，只有各司其职的钢铁编队。"
 naval_overhaul.2.a: "总结演习经验，提升全军战备。"
 naval_overhaul.2.b: "将改装需求反馈给各大造船厂。"
 utility_mod_scouting_seaplane: "舰载侦察水上飞机"
