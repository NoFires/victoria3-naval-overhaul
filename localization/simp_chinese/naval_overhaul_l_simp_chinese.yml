 ship_mod_slot_hull: "船体结构"
 ship_mod_slot_secondary: "副炮与防空"
 ship_mod_slot_utility_4: "配件槽位4"
 NAVAL_BATTLE_SIZE_RECON_ADVANTAGE: "舰队侦察与隐蔽态势修正"

 ship_mod_hull_standard: "标准均衡船体"
 ship_mod_hull_standard_desc: "结构可靠、易于维护的标准造船工艺，兼顾耐久度与后勤经济性。"
 ship_mod_hull_lightweight: "轻量化高速船体"
 ship_mod_hull_lightweight_desc: "削减冗余结构以换取更高航速、更低可视性与更大补给容量，代价是船体耐久度下降。"
 ship_mod_hull_reinforced: "加强防护船体"
 ship_mod_hull_reinforced_desc: "加厚外板与结构支撑，大幅提升船体耐久度与装甲防护，但会降低航速并减少补给容量。"
 ship_mod_hull_subdivided: "细密水密隔舱船体"
 ship_mod_hull_subdivided_desc: "纵横交错的细密水密隔舱结构，显著降低承受的船体损伤与被致命一击风险，仅略微占用补给容量。"
 ship_mod_supply_ship_hull_light: "无武装商船船体"
 ship_mod_supply_ship_hull_light_desc: "专为舰队后勤补给优化的基础商船船体，不占用额外作战建造消耗。"

 ship_mod_secondary_standard: "标准副炮组"
 ship_mod_secondary_standard_desc: "常规小口径副炮配置，提供基础近距火力与护航屏卫力。"
 ship_mod_secondary_torpedo_defense: "反雷击驱逐副炮"
 ship_mod_secondary_torpedo_defense_desc: "密集速射副炮阵提升屏卫力、战备恢复及对鱼雷艇与驱逐舰的命中率，但会小幅增加可视性。"
 ship_mod_secondary_heavy_aa: "重型防空高射炮组"
 ship_mod_secondary_heavy_aa_desc: "高射速大仰角副炮阵，大幅增强舰队屏卫力与对轻型雷击舰的拦截命中，代价是增加可视性。"
 ship_mod_secondary_asw_depth_charges: "反潜深弹副炮组"
 ship_mod_secondary_asw_depth_charges_desc: "配备深水炸弹投射器与反潜听音装备，大幅提升舰队侦察力与对潜艇的命中率。"
 ship_mod_secondary_dual_purpose: "高平两用副炮组"
 ship_mod_secondary_dual_purpose_desc: "大仰角高射速高平两用副炮，兼顾额外主辅火力、屏卫力与战备恢复，但会增加可视性并占用补给容量。"
 ship_mod_supply_ship_secondary_light: "无武装辅助甲板"
 ship_mod_supply_ship_secondary_light_desc: "专供后勤补给舰使用的无武装上层建筑配置，不产生作战建造消耗。"

 utility_mod_fire_control_radar: "火控雷达与光学测距仪"
 utility_mod_fire_control_radar_desc: "精密光学与无线电雷达火控系统，显著提升主炮命中率与海区侦察力，但桅杆信号会增加可视性并占用补给容量。"
 utility_mod_sonar_suite: "主动声呐与深水炸弹"
 utility_mod_sonar_suite_desc: "专业反潜探测与深弹投射装置，大幅增强侦察力及对潜艇的命中效率，代价是航速略微下降。"
 utility_mod_damage_control: "中央损管与防雷隔舱"
 utility_mod_damage_control_desc: "体系化消防注水与损管小组，大幅降低承受的船体伤害、船员伤亡与被致命一击概率。"
 utility_mod_aa_director: "防空火控指挥仪"
 utility_mod_aa_director_desc: "集中式高炮指挥仪，显著增强舰队防空与近距屏卫力并加快战备恢复，代价是增加可视性。"
 utility_mod_torpedo_tubes: "甲板鱼雷发射管"
 utility_mod_torpedo_tubes_desc: "可对敌方舰艇造成致命重创的甲板重型鱼雷，但外置鱼雷管会增大自身易损性与可视性。"
 utility_mod_autoloader: "机械式快速装弹机"
 utility_mod_autoloader_desc: "自动化扬弹与装填机构，大幅加快射击准备速度，但高射速会略微降低单轮命中精度并占用补给容量。"
 utility_mod_dazzle_camo: "炫目迷彩涂装"
 utility_mod_dazzle_camo_desc: "光学干扰迷彩涂装，显著降低舰船可视性并减少被致命一击概率。"
 utility_mod_snorkel: "潜艇通气管"
 utility_mod_snorkel_desc: "允许潜艇在水下潜望镜深度使用柴油机充电并航行，大幅降低可视性并延长远洋航程，代价是水下航速略降。"
 utility_mod_hydrophone_array: "被动水听器阵列"
 utility_mod_hydrophone_array_desc: "静默被动声学监听阵列，显著提升海区侦察力、接战准备度与对潜艇命中率，仅占用少量补给容量。"
 utility_mod_extra_bunkers: "远洋副油箱与补给舱"
 utility_mod_extra_bunkers_desc: "扩展燃油与淡水储备舱，大幅延长无补给远洋作战半径与补给容量，但额外重量会略微降低航速并增加可视性。"
 utility_mod_reinforced_magazine: "防爆弹药库"
 utility_mod_reinforced_magazine_desc: "加厚防闪燃装甲隔门，提升舰体装甲并大幅降低被致命一击概率，代价是重量增加导致航速略降。"
 utility_mod_minesweeping_gear: "扫雷具与护航绞车"
 utility_mod_minesweeping_gear_desc: "近海扫雷与护航作业设备，大幅提升舰队屏卫力与侦察力，拖曳作业会略微降低航速。"
 utility_mod_scouting_seaplane: "弹射侦察水上飞机"
 utility_mod_scouting_seaplane_desc: "舰载弹射侦察机极大扩展海区侦察力，但甲板机库与地勤会增加可视性并占用补给容量。"

 modifier_naval_construction_boom: "海军造船繁荣"
 modifier_naval_hegemony_tier_1: "地区海军强国"
 modifier_naval_hegemony_tier_2: "大洋海权帝国"
 modifier_naval_hegemony_tier_3: "全球制海霸主"
 modifier_naval_victory_morale: "海战大捷士气"
 modifier_naval_arms_race_momentum: "海军军备竞赛势头"
 modifier_naval_arms_race_focus: "海军军备竞赛动员"

 je_naval_arms_race: "大洋争霸：海军军备竞赛"
 je_naval_arms_race_reason: "随着铁甲与巨炮时代的来临，各大强国围绕远洋航线与殖民地展开了激烈的舰队竞赛。扩充现代化舰队与造船工业，以确立无可争议的制海权。"
 je_naval_arms_race_treaty_freeze_header: "海军限武条约冻结军备竞赛"
 je_naval_arms_race_treaty_freeze_effect_header: "造舰竞赛动员中止"
 je_naval_arms_race_treaty_freeze_desc: "国际海军限武条约已对我国主力舰队施加具有约束力的吨位上限，无限制的大洋造舰竞赛暂时冻结；若未来条约瓦解或启动自动升级条款，军备竞赛将再度点燃。"

 naval_overhaul.1.t: "大洋舰队辩论"
 naval_overhaul.1.d: "海军部与财政部就我国未来十年的造舰路线展开了激烈辩论。究竟应当集中资源打造决战主力舰队，还是大力扶持造船厂与护航驱逐体系？"
 naval_overhaul.1.f: "“谁控制了海洋，谁就控制了世界贸易；谁控制了世界贸易，谁就拥有了全世界的财富。”"
 naval_overhaul.1.a: "贯彻决战舰队主义！"
 naval_overhaul.1.b: "扩建船坞，以造舰订单拉动工业。"
 naval_overhaul.1.c: "强化海员训练与舰队战术素养。"

 naval_overhaul.2.t: "现代海战联合演习"
 naval_overhaul.2.d: "我国海军近期组织了涵盖潜艇破交、驱逐反潜与主力舰炮击的跨海区联合演习，验证了全新十槽改装体系的协同作战能力。"
 naval_overhaul.2.f: "没有单一的无敌巨舰，只有各司其职的钢铁编队。"
 naval_overhaul.2.a: "总结演习经验，提升全军战备。"
 naval_overhaul.2.b: "将改装需求反馈给各大造船厂。"
