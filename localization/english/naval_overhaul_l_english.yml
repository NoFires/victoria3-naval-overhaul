 naval_overhaul.3.t: "Sail-to-Ironclad Transition Friction"
 naval_overhaul.3.d: "Traditionalists in the Admiralty cling to wooden broadsides, even as steam-powered ironclads render our old line-of-battle ships obsolete."
 naval_overhaul.3.f: "Oak and canvas built an empire; iron and steam must now defend it."
 naval_overhaul.3.a: "Accelerate dockyard modernization for ironclad hulls."
 naval_overhaul.3.b: "Preserve officer traditions and phase in reforms gradually."

 naval_overhaul.4.t: "Submarine Commerce Raiding & Convoy Reform"
 naval_overhaul.4.d: "Undersea raiders threaten merchant shipping lanes, forcing our naval staff to choose between organized convoy escorts or aggressive anti-submarine sweeps."
 naval_overhaul.4.f: "What sails unseen beneath the waves tests the discipline of every escort."
 naval_overhaul.4.a: "Adopt an organized convoy escort doctrine."
 naval_overhaul.4.b: "Launch an anti-submarine shipbuilding mobilization."

 naval_overhaul.5.t: "Fire-Control & Radar Breakthrough"
 naval_overhaul.5.d: "Our naval engineers have demonstrated a workable radio-ranging and fire-control suite capable of tracking targets through darkness and squalls."
 naval_overhaul.5.f: "When optics fail in storm or night, radio waves still find the hull."
 naval_overhaul.5.a: "Standardize fire-control radar across the battlefleet."
 naval_overhaul.5.b: "Channel the breakthrough into renewed fleet expansion."

 naval_overhaul.6.t: "Naval Aviation Sea Trials"
 naval_overhaul.6.d: "Scouting seaplanes and carrier-borne aircraft have completed their first fleet exercises, dramatically extending reconnaissance reach."
 naval_overhaul.6.f: "The horizon is no longer bounded by the height of the masthead."
 naval_overhaul.6.a: "Establish a permanent Naval Aviation Corps."
 naval_overhaul.6.b: "Celebrate the successful trials across the fleet."

 naval_overhaul.7.t: "Flagship Victory Triumph"
 naval_overhaul.7.d: "Our [concept_fleet] flagship has emerged victorious from a decisive engagement at sea, inspiring dockworkers and sailors alike."
 naval_overhaul.7.f: "A flagship's triumph echoes from the waves to the capital."
 naval_overhaul.7.a: "Proclaim a national naval triumph."
 naval_overhaul.7.b: "Use the victory to project restrained maritime prestige."
 je_naval_arms_race_status_wartime: "Wartime mobilization: every slipway is turned over to the battle fleet."
 je_naval_arms_race_status_leading: "We out-build every rival on the slipways; the Admiralty presses to keep the lead."
 je_naval_arms_race_status_trailing: "A rival fleet still outnumbers ours; the race is far from won."
