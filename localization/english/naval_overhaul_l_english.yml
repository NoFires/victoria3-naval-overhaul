 ship_mod_hull_standard: "Standard Balanced Hull"
 ship_mod_hull_standard_desc: "Reliable and economical shipbuilding layout balancing durability and supply upkeep."
 ship_mod_hull_lightweight: "Lightweight High-Speed Hull"
 ship_mod_hull_lightweight_desc: "Reduces structural weight for higher speed, lower visibility, and reduced supply consumption."
 ship_mod_hull_reinforced: "Reinforced Watertight Hull"
 ship_mod_hull_reinforced_desc: "Multi-layered watertight bulkheads and anti-torpedo bulges boost survivability at the cost of speed and supply."
 ship_mod_hull_subdivided: "Subdivided Watertight Hull"
 ship_mod_hull_subdivided_desc: "Dense transverse and longitudinal watertight bulkheads reducing hull damage and critical flooding."
 ship_mod_secondary_dual_purpose: "Dual-Purpose Secondary Battery"
 ship_mod_secondary_dual_purpose_desc: "High-angle rapid-fire dual-purpose guns balancing surface torpedo defense and AA screening."
 ship_mod_secondary_heavy_aa: "Heavy Anti-Aircraft Battery"
 ship_mod_secondary_heavy_aa_desc: "Heavy AA gun batteries specialized in carrier interception and fleet screening."
 ship_mod_secondary_asw_depth_charges: "ASW & Depth Charge Battery"
 ship_mod_secondary_asw_depth_charges_desc: "Depth-charge throwers and rapid-fire guns boosting submarine detection, accuracy, and hull damage."
 utility_mod_sonar_suite: "Active Sonar & Depth Charges"
 utility_mod_sonar_suite_desc: "Dedicated ASW suite granting high detection and severe accuracy bonuses against submarines."
 utility_mod_snorkel: "Submarine Snorkel"
 utility_mod_snorkel_desc: "Allows submerged diesel operation, drastically lowering visibility and extending oceanic range."
 utility_mod_minesweeping_gear: "Minesweeping & Escort Gear"
 utility_mod_minesweeping_gear_desc: "Coastal minesweeping winches boosting fleet screening and detection."

 ship_mod_secondary_standard: "Standard Secondary Battery"
 ship_mod_secondary_standard_desc: "Conventional light secondary guns providing baseline close-in defense and screening."
 ship_mod_secondary_torpedo_defense: "Anti-Torpedo Secondary Battery"
 ship_mod_secondary_torpedo_defense_desc: "Dense rapid-fire batteries tailored to intercept torpedo boats, destroyers, and submarines."
 ship_mod_secondary_heavy_casemate: "Heavy Casemate Battery"
 ship_mod_secondary_heavy_casemate_desc: "Heavy casemate guns add substantial hull and crew damage while increasing visibility and vulnerability."

 utility_mod_fire_control_radar: "Fire Control Radar & Rangefinder"
 utility_mod_fire_control_radar_desc: "Precision optical and radio fire control boosting accuracy and critical hit chance, at the cost of visibility."
 utility_mod_damage_control: "Central Damage Control"
 utility_mod_damage_control_desc: "Coordinated flooding and fire control teams reducing hull damage, crew casualties, and incoming crits."
 utility_mod_aa_director: "AA Fire Director"
 utility_mod_aa_director_desc: "Centralized anti-aircraft director providing heavy screening and carrier interception."
 utility_mod_torpedo_tubes: "Deck Torpedo Tubes"
 utility_mod_torpedo_tubes_desc: "Heavy deck-mounted torpedoes boosting hull damage and critical strikes, while raising vulnerability."
 utility_mod_extra_bunkers: "Auxiliary Fuel Bunkers"
 utility_mod_extra_bunkers_desc: "Expanded fuel and fresh water storage extending operational range and cutting supply cost."
 utility_mod_dazzle_camo: "Dazzle Camouflage & Degaussing"
 utility_mod_dazzle_camo_desc: "Disruptive optical camouflage lowering ship visibility and incoming critical hit chance."
 utility_mod_hydrophone_array: "Passive Hydrophone Array"
 utility_mod_hydrophone_array_desc: "Silent acoustic listening array providing high detection and convoy raiding efficiency with minimal exposure."
 utility_mod_autoloader: "Mechanical Autoloader"
 utility_mod_autoloader_desc: "Automated ammunition hoists accelerating gun readiness at the expense of vulnerability and supply."
 utility_mod_reinforced_magazine: "Anti-Flash Magazine"
 utility_mod_reinforced_magazine_desc: "Armored flash-tight magazine doors drastically lowering vulnerability and critical hit risk."
 utility_mod_scouting_seaplane: "Catapult Scouting Seaplane"
 utility_mod_scouting_seaplane_desc: "Shipborne scout aircraft expanding fleet detection and gunfire spotting, increasing visibility."

