 ship_mod_hull_standard: "Standard Balanced Hull"
 ship_mod_hull_standard_desc: "Reliable and economical shipbuilding layout balancing durability and supply capacity."
 ship_mod_hull_lightweight: "Lightweight High-Speed Hull"
 ship_mod_hull_lightweight_desc: "Reduces structural bulk for higher speed, lower visibility, and greater supply capacity at the cost of hull durability."
 ship_mod_hull_reinforced: "Reinforced Armored Hull"
 ship_mod_hull_reinforced_desc: "Heavy structural plating boosts hull durability and armor protection at the cost of speed and supply capacity."
 ship_mod_hull_subdivided: "Subdivided Watertight Hull"
 ship_mod_hull_subdivided_desc: "Dense transverse and longitudinal watertight bulkheads reducing incoming hull damage and critical hit risk, with a minor supply capacity penalty."
 ship_mod_supply_ship_hull_light: "Unarmored Merchant Hull"
 ship_mod_supply_ship_hull_light_desc: "Basic merchant cargo hull optimized for carrying fleet supplies with zero combat overhead."

 ship_mod_secondary_standard: "Standard Secondary Battery"
 ship_mod_secondary_standard_desc: "Conventional light secondary guns providing baseline close-in firepower and screening."
 ship_mod_secondary_torpedo_defense: "Anti-Torpedo Secondary Battery"
 ship_mod_secondary_torpedo_defense_desc: "Dense rapid-fire secondary batteries improve screening, readiness gain, and accuracy against torpedo craft and destroyers, slightly raising visibility."
 ship_mod_secondary_heavy_aa: "Heavy Anti-Aircraft Battery"
 ship_mod_secondary_heavy_aa_desc: "High-angle rapid-fire batteries substantially boost fleet screening and accuracy against torpedo craft at the cost of visibility."
 ship_mod_secondary_asw_depth_charges: "ASW & Depth Charge Battery"
 ship_mod_secondary_asw_depth_charges_desc: "Depth-charge throwers and ASW gear substantially boost fleet detection and accuracy against submarines."
 ship_mod_secondary_dual_purpose: "Dual-Purpose Secondary Battery"
 ship_mod_secondary_dual_purpose_desc: "High-angle rapid-fire dual-purpose guns balancing extra firepower, screening, and readiness gain while increasing visibility and reducing supply capacity."
 ship_mod_supply_ship_secondary_light: "Unarmed Auxiliary Fitting"
 ship_mod_supply_ship_secondary_light_desc: "Unarmed logistics superstructure reserved for fleet supply ships without combat overhead."

 utility_mod_fire_control_radar: "Fire Control Radar & Rangefinder"
 utility_mod_fire_control_radar_desc: "Precision optical and radio radar fire control boosts accuracy and detection while raising visibility and reducing supply capacity."
 utility_mod_sonar_suite: "Active Sonar & Depth Charges"
 utility_mod_sonar_suite_desc: "Dedicated ASW suite granting high detection and severe accuracy bonuses against submarines at a minor speed penalty."
 utility_mod_damage_control: "Central Damage Control"
 utility_mod_damage_control_desc: "Coordinated flooding and fire control teams reducing incoming hull damage, crew casualties, and critical hit risk."
 utility_mod_aa_director: "AA Fire Director"
 utility_mod_aa_director_desc: "Centralized anti-aircraft director providing heavy fleet screening and faster readiness gain at the cost of higher visibility."
 utility_mod_torpedo_tubes: "Deck Torpedo Tubes"
 utility_mod_torpedo_tubes_desc: "Heavy deck-mounted torpedoes boosting hull damage and critical strikes, while raising visibility and vulnerability."
 utility_mod_autoloader: "Mechanical Autoloader"
 utility_mod_autoloader_desc: "Automated ammunition hoists accelerate gun readiness at the expense of slight accuracy loss and reduced supply capacity."
 utility_mod_dazzle_camo: "Dazzle Camouflage"
 utility_mod_dazzle_camo_desc: "Disruptive optical camouflage lowering ship visibility and incoming critical hit chance."
 utility_mod_snorkel: "Submarine Snorkel"
 utility_mod_snorkel_desc: "Allows submerged diesel operation, drastically lowering visibility and extending oceanic range at a slight speed penalty."
 utility_mod_hydrophone_array: "Passive Hydrophone Array"
 utility_mod_hydrophone_array_desc: "Silent passive acoustic array boosting detection, readiness gain, and submarine accuracy at a minor supply capacity cost."
 utility_mod_extra_bunkers: "Auxiliary Fuel Bunkers"
 utility_mod_extra_bunkers_desc: "Expanded fuel and freshwater bunkers extend operational range and supply capacity at a slight cost to speed and visibility."
 utility_mod_reinforced_magazine: "Anti-Flash Magazine"
 utility_mod_reinforced_magazine_desc: "Armored flash-tight magazine doors increase armor and drastically cut incoming critical hit risk at a slight speed penalty."
 utility_mod_minesweeping_gear: "Minesweeping & Escort Gear"
 utility_mod_minesweeping_gear_desc: "Coastal minesweeping winches boosting fleet screening and detection at a minor speed cost."
 utility_mod_scouting_seaplane: "Catapult Scouting Seaplane"
 utility_mod_scouting_seaplane_desc: "Shipborne catapult scout aircraft expand fleet detection, while deck hangars raise visibility and consume supply capacity."

 modifier_naval_construction_boom: "Naval Construction Boom"
 modifier_naval_hegemony_tier_1: "Regional Naval Power"
 modifier_naval_hegemony_tier_2: "Oceanic Sea Power"
 modifier_naval_hegemony_tier_3: "Global Thalassocracy"
 modifier_naval_victory_morale: "Naval Victory Spirit"
 modifier_naval_arms_race_momentum: "Naval Arms Race Momentum"
 modifier_naval_arms_race_focus: "Naval Arms Race Mobilization"

 je_naval_arms_race: "Struggle for the Seas: Naval Arms Race"
 je_naval_arms_race_reason: "With the advent of ironclads and big-gun warships, great powers compete fiercely for oceanic sea lanes. Expand our modern fleet and shipyards to secure undisputed command of the seas."
 je_naval_arms_race_treaty_freeze_header: "Arms Race Suspended by Naval Treaty"
 je_naval_arms_race_treaty_freeze_effect_header: "Shipyard Mobilization Suspended"
 je_naval_arms_race_treaty_freeze_desc: "International naval arms limitation has placed binding caps on our capital battleline, suspending the unrestricted shipbuilding race until treaty restrictions end or the escalator clause is invoked."

 naval_overhaul.1.t: "The High Seas Fleet Debate"
 naval_overhaul.1.d: "The Admiralty and the Treasury are locked in debate over our naval doctrine for the coming decade: concentrate resources on capital battlelines, or subsidize shipyards and escort fleets?"
 naval_overhaul.1.f: "\"Whoever commands the sea commands the trade; whosoever commands the trade of the world commands the riches of the world itself.\""
 naval_overhaul.1.a: "Commit to the decisive battleline doctrine!"
 naval_overhaul.1.b: "Expand shipyards through sustained naval contracts."
 naval_overhaul.1.c: "Invest in naval officer training and fleet readiness."

 naval_overhaul.2.t: "Combined Fleet Tactical Exercises"
 naval_overhaul.2.d: "Our navy recently conducted multi-node exercises combining submarine raiding, destroyer ASW screening, and capital gunnery under our modernized 10-slot refit doctrine."
 naval_overhaul.2.f: "No single warship rules the waves alone—only a balanced fleet."
 naval_overhaul.2.a: "Distribute tactical lessons across the fleet."
 naval_overhaul.2.b: "Forward refit feedback to our domestic shipyards."

 utility_mod_underway_replenishment: "Underway Replenishment Gear"
 utility_mod_underway_replenishment_desc: "Specialized transfer rigs and replenishment hoses allow warships to refuel and rearm at sea, extending [concept_fleet] endurance."

 naval_condition_night_action: "Night Action"
 naval_condition_night_action_desc: "Darkness shrouds the engagement, hampering optical gunnery and screening coordination."
 naval_condition_squall_line: "Sudden Squall"
 naval_condition_squall_line_desc: "Violent gusts and blinding rain disrupt formation keeping and fire control."
 naval_condition_subsurface_ambush: "Submarine Ambush Waters"
 naval_condition_subsurface_ambush_desc: "Reports of periscopes and torpedo wakes force escorts into constant evasive maneuvers."
 naval_condition_heavy_swell: "Heavy Ocean Swell"
 naval_condition_heavy_swell_desc: "Long rolling swells pitch gun platforms and slow [concept_fleet] maneuvers."
 naval_condition_clear_horizon: "Clear Horizon"
 naval_condition_clear_horizon_desc: "Crisp visibility favors aerial spotting and long-range gunnery."

 naval_arms_race_progress_bar: "Naval Buildup Momentum"
 naval_arms_race_progress_bar_desc: "Tracks the pace of capital ship expansion toward maritime dominance."
 naval_arms_race_progress_surge_desc: "Rapid Fleet Expansion"
 naval_arms_race_progress_steady_desc: "Steady Dockyard Output"
 naval_arms_race_progress_stall_desc: "Fleet Contraction"
 naval_arms_race_emergency_budget_btn: "Emergency Naval Estimates"
 naval_arms_race_emergency_budget_btn_desc: "Approve emergency supplementary appropriations to accelerate shipyard output at higher materiel cost."
 naval_arms_race_diplomatic_inquiry_btn: "Diplomatic Fleet Inquiry"
 naval_arms_race_diplomatic_inquiry_btn_desc: "Signal restraint to rival admiralties to ease international suspicion."
 je_naval_arms_race_status_treaty_escalator: "Escalator Clause Invoked: Naval expansion has resumed."
 je_naval_arms_race_status_active: "Dockyards are racing to reach 80 flotillas."
 je_naval_arms_race_shrink_header: "Naval Retrenchment"
 je_naval_arms_race_shrink_effect_header: "Arms Race Abandoned"
 je_naval_arms_race_shrink_desc: "Our [concept_fleet] has fallen below the threshold required to sustain a naval arms race."

